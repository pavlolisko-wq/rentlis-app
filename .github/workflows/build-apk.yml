name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        working-directory: RentlisGroop-fixed
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > rentlis.jks
            echo "Signing with the permanent Rentlis key"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set. APK is signed with a temporary debug key and will NOT install as an update."
          fi

      - name: Build debug APK
        working-directory: RentlisGroop-fixed
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Remove signing key
        if: always()
        run: rm -f RentlisGroop-fixed/rentlis.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentlisGroop-v1.6-build${{ github.run_number }}
          path: RentlisGroop-fixed/app/build/outputs/apk/debug/app-debug.apk
