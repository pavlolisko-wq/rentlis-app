plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'md.rentlis.groop'
    compileSdk 34
    defaultConfig {
        applicationId "md.rentlis.groop"
        minSdk 26
        targetSdk 34
        // В CI versionCode растёт с каждой сборкой (номер запуска GitHub Actions),
        // поэтому новый APK всегда ставится поверх старого как обновление.
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger() + 100)
        versionName "1.6"
    }
    // Постоянный ключ подписи. CI кладёт его в rentlis.jks из секрета KEYSTORE_BASE64.
    // Один и тот же ключ = Android принимает APK как обновление (данные сохраняются).
    def rentlisKs = rootProject.file("rentlis.jks")
    def rentlisPass = System.getenv("KEYSTORE_PASSWORD")
    def hasRentlisKey = rentlisKs.exists() && rentlisPass
    if (hasRentlisKey) {
        signingConfigs {
            rentlis {
                storeFile rentlisKs
                storePassword rentlisPass
                keyAlias "rentlis"
                keyPassword rentlisPass
            }
        }
    }
    buildTypes {
        debug {
            if (hasRentlisKey) signingConfig signingConfigs.rentlis
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasRentlisKey) signingConfig signingConfigs.rentlis
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
